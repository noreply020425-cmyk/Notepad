<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad | Login</title>

    <script>
        (function () {
            var d = document.documentElement, t = "light";
            try { t = localStorage.getItem("notepad_theme") === "dark" ? "dark" : "light"; } catch (e) {}
            d.setAttribute("data-theme", t);
            var ready = function () { d.classList.add("icons-ready"); };
            window.addEventListener("load", function () {
                (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(ready, ready);
            });
            setTimeout(ready, 2500);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <header class="header">
            <span class="brand-mark"><span class="material-symbols-rounded">edit_note</span></span>
            <div class="header-copy">
                <h1>Notepad</h1>
                <p>Sign in to your workspace</p>
            </div>
            <button id="themeToggle" class="theme-btn" type="button"
                title="Switch to dark mode" aria-label="Toggle dark mode">
                <span class="material-symbols-rounded" id="themeIcon" aria-hidden="true">dark_mode</span>
            </button>
        </header>

        <!-- Already signed in -->
        <section id="signedInView" hidden>
            <p class="signed-in-as">Signed in as <strong id="accountEmail"></strong></p>
            <button id="continueBtn" class="launch-btn" type="button">
                <span class="material-symbols-rounded" aria-hidden="true">rocket_launch</span>
                <span>Launch Notepad</span>
            </button>
            <div class="actions">
                <button id="clearCredentials" type="button">
                    <span class="material-symbols-rounded" aria-hidden="true">logout</span>
                    Sign out
                </button>
            </div>
        </section>

        <!-- Sign in / create account -->
        <section id="authView">
            <div class="mode-switch" role="group" aria-label="Account">
                <button type="button" class="active" data-mode="login" aria-pressed="true">Sign in</button>
                <button type="button" data-mode="register" aria-pressed="false">Create account</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required>
                </div>

                <div id="registerFields" hidden>
                    <div class="form-group">
                        <label for="oracleId">Oracle ID</label>
                        <input type="text" id="oracleId" placeholder="Enter Oracle ID" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter your name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="repId">Rep ID</label>
                        <input type="text" id="repId" placeholder="Enter Rep ID" autocomplete="off">
                    </div>
                </div>

                <p class="form-error" id="formError" role="alert" hidden></p>

                <button type="submit" class="launch-btn" id="submitBtn">
                    <span class="material-symbols-rounded" aria-hidden="true">rocket_launch</span>
                    <span id="submitLabel">Sign in and launch</span>
                </button>
            </form>
        </section>

        <p class="privacy-note">
            <span class="material-symbols-rounded" aria-hidden="true">lock</span>
            <span>Your account and plan are stored on our server. Your notes stay only in this browser, so avoid storing sensitive customer data.</span>
        </p>

        <footer>© 2026 Notepad</footer>
    </main>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="dialog.js"></script>
    <script src="script.js"></script>
</body>
</html>
